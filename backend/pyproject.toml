[project]
name = "nodara-api"
version = "0.1.0"
description = "FastAPI and LangChain backend for Nodara"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-openai>=0.0.8",
    "langgraph>=1.0.0,<2.0.0",
    "langfuse>=4.0.0,<5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_vision: calls the configured multimodal LLM and requires local credentials",
]
